services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: employee_app
      POSTGRES_USER: employee_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./drizzle:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employee_app -d employee_app"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: .
      target: tools
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://employee_app:${POSTGRES_PASSWORD:-local-development-only}@db:5432/employee_app
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
  seed:
    build:
      context: .
      target: tools
    command: ["npm", "run", "db:seed"]
    environment:
      DATABASE_URL: postgresql://employee_app:${POSTGRES_PASSWORD:-local-development-only}@db:5432/employee_app
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://employee_app:${POSTGRES_PASSWORD:-local-development-only}@db:5432/employee_app
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-development-secret-change-before-production}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:

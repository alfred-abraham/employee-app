steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/employee-app:${_TAG}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - tools
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/employee-app-migrate:${_TAG}
      - .
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/employee-app:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/employee-app-migrate:${_TAG}
options:
  logging: CLOUD_LOGGING_ONLY
